pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'fabric-loom' version '1.13.6'
    }
}

rootProject.name = 'minecraft_client_mod'

include 'common'
include 'fabric-1.20.1'
include 'fabric-1.21.1'
include 'fabric-26.3'
